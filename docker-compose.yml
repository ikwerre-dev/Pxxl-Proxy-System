services:
  edge:
    build:
      context: .
      dockerfile: edge/docker/Dockerfile
    image: pxxl/edge:local
    container_name: pxxl-proxy-edge
    restart: unless-stopped
    environment:
      PXXL_CONFIG: /app/config/pxxl.toml
      RUST_LOG: pxxl_edge=info,pxxl=info
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
      - "9090:9090"
    volumes:
      - ./config:/app/config:ro
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - redis
      - postgres
      - clickhouse

  redis:
    image: redis:7-alpine
    container_name: pxxl-proxy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: pxxl-proxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pxxl
      POSTGRES_PASSWORD: pxxl
      POSTGRES_DB: pxxl
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: pxxl-proxy-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: pxxl
      CLICKHOUSE_USER: pxxl
      CLICKHOUSE_PASSWORD: pxxl
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: pxxl-proxy-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - edge

  loki:
    image: grafana/loki:3.2.0
    container_name: pxxl-proxy-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.2.0
    container_name: pxxl-proxy-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pxxl-proxy-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pxxl
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  clickhouse-data:
  grafana-data:
  loki-data:
