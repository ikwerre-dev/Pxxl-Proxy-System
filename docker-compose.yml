services:
  edge:
    build:
      context: .
      dockerfile: edge/docker/Dockerfile
    image: pxxl/edge:local
    container_name: pxxl-edge
    restart: unless-stopped
    environment:
      PXXL_CONFIG: /app/config/pxxl.toml
      RUST_LOG: pxxl_edge=info,pxxl=info
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
      - "9090:9090"
    volumes:
      - ./config:/app/config:ro
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - redis
      - postgres
      - clickhouse

  redis:
    image: redis:7-alpine
    container_name: pxxl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: pxxl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pxxl
      POSTGRES_PASSWORD: pxxl
      POSTGRES_DB: pxxl
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: pxxl-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: pxxl-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - edge

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pxxl-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pxxl
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  clickhouse-data:
  grafana-data:

