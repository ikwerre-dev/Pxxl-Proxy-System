services:
  edge:
    build:
      context: .
      dockerfile: edge/docker/Dockerfile
    image: pxxl/edge:local
    container_name: pxxl-proxy-edge
    restart: unless-stopped
    environment:
      PXXL_CONFIG: /app/config/pxxl.toml
      PXXL_ADMIN_ADDR: 0.0.0.0:8081
      PXXL_METRICS_ADDR: 0.0.0.0:9090
      PXXL_ADMIN_EMAIL: ${PXXL_ADMIN_EMAIL:-}
      PXXL_ADMIN_PASSWORD_HASH: ${PXXL_ADMIN_PASSWORD_HASH:-}
      PXXL_ADMIN_BOOTSTRAP_TOKEN: ${PXXL_ADMIN_BOOTSTRAP_TOKEN:-}
      PXXL_ADMIN_IP_ALLOWLIST: ${PXXL_ADMIN_IP_ALLOWLIST:-}
      PXXL_METRICS_BEARER_TOKEN: ${PXXL_METRICS_BEARER_TOKEN:-}
      PXXL_DOCKER_ENABLED: ${PXXL_DOCKER_ENABLED:-false}
      PXXL_PODMAN_ENABLED: ${PXXL_PODMAN_ENABLED:-false}
      RUST_LOG: pxxl_edge=info,pxxl=info
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config:/app/config:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "test -x /usr/local/bin/pxxl-edge"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
      - postgres
      - clickhouse

  redis:
    image: redis:7-alpine
    container_name: pxxl-proxy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data

  postgres:
    image: postgres:16-alpine
    container_name: pxxl-proxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pxxl
      POSTGRES_PASSWORD: pxxl
      POSTGRES_DB: pxxl
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: pxxl-proxy-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: pxxl
      CLICKHOUSE_USER: pxxl
      CLICKHOUSE_PASSWORD: pxxl
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: pxxl-proxy-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    depends_on:
      - edge

  loki:
    image: grafana/loki:3.2.0
    container_name: pxxl-proxy-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki

  promtail:
    image: grafana/promtail:3.2.0
    container_name: pxxl-proxy-promtail
    profiles:
      - runtime-discovery
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pxxl-proxy-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
