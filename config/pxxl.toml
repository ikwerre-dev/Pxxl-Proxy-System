[listeners]
http = "0.0.0.0:80"
https = "0.0.0.0:443"
admin = "127.0.0.1:8081"
metrics = "127.0.0.1:9090"

[tls]
mode = "local"
cert_dir = "/data/certs"
local_subject_alt_names = ["localhost", "pxxlhost", "*.pxxlhost"]

[docker]
enabled = false
socket_path = "/var/run/docker.sock"
poll_seconds = 5

[podman]
enabled = false
socket_path = "/var/run/podman/podman.sock"
published_host = "host.docker.internal"
poll_seconds = 5

[database_proxy]
enabled = false

[[database_proxy.listeners]]
type = "postgres"
listen = "0.0.0.0:5432"

[error_pages]
enabled = true
dir = "config/error-pages"

[geoip]
enabled = true
database_path = "config/geoip/geoip.csv"

[admin]
auth_enabled = true
token_store_key = "pxxl:admin_tokens"
ip_allowlist = ["127.0.0.1", "::1"]

[metrics]
# Optional bearer token required by /metrics when set.

[health_checks]
enabled = true
interval_seconds = 10
timeout_ms = 1500
path = "/"

[security.rate_limits]
# Local development frontends such as Vite/TanStack can request hundreds of
# module files at once during a cold load. Keep this high in the sample config;
# production installs should tune it per deployment.
requests_per_second = 2000
burst = 5000

[security.blacklists]
cidrs = []

[redis]
url = "redis://redis:6379"
blacklist_channel = "pxxl:blacklist"

[storage]
postgres_url = "postgres://pxxl:pxxl@postgres:5432/pxxl"
clickhouse_url = "http://pxxl:pxxl@clickhouse:8123"
analytics_enabled = true

[[routes]]
id = "admin-example"
domain = "admin.pxxlhost"
tls = true

[[routes.upstreams]]
url = "http://grafana:3000"
weight = 1
