<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not Found | Pxxl Proxy</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #101318; color: #f5f7fb; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(680px, 100%); border: 1px solid #2a3342; border-radius: 8px; background: #171c24; padding: 32px; }
    .code { color: #66d9c7; font-size: 14px; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(30px, 5vw, 46px); line-height: 1.05; }
    p, dd { color: #a9b2c3; }
    p { margin: 0; font-size: 16px; line-height: 1.6; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; margin: 28px 0 0; font-size: 14px; }
    dt { font-weight: 700; }
    dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="code">Pxxl Proxy / 404</div>
    <h1>No route matched.</h1>
    <p>{{message}}</p>
    <dl><dt>Domain</dt><dd>{{domain}}</dd><dt>Path</dt><dd>{{path}}</dd></dl>
  </main>
</body>
</html>
