<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found</title>
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }
    .not-found {
      position: relative;
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
    }
    .logo-link {
      position: absolute;
      z-index: 40;
      top: 32px;
      right: 0;
      left: 0;
      display: block;
      width: fit-content;
      margin: 0 auto;
    }
    .logo-link img {
      display: block;
      width: 112px;
      height: auto;
    }
    .large-layer {
      position: absolute;
      z-index: 1;
      top: 140px;
      right: 0;
      left: 0;
      pointer-events: none;
    }
    .large-layer.shadow {
      z-index: 0;
      top: 145px;
    }
    .large-404,
    .medium-404 {
      margin: 0 auto;
      font-weight: 600;
      line-height: 0.9;
      text-align: center;
      transform: rotate(-0.133deg);
      user-select: none;
      white-space: nowrap;
    }
    .large-404 {
      font-size: 262.916px;
      color: rgba(217, 217, 217, 0.04);
    }
    .large-layer.shadow .large-404 {
      color: rgba(255, 255, 255, 0.012);
    }
    .medium-layers {
      position: relative;
      z-index: 2;
      margin-top: 200px;
      height: 210px;
    }
    .medium-404 {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      font-size: 100.999px;
      color: rgba(255, 255, 255, 0.12);
    }
    .medium-404.front {
      top: 12px;
      color: rgba(255, 255, 255, 0.40);
    }
    .content {
      position: relative;
      z-index: 3;
      width: min(100%, 440px);
      margin: 130px auto 0;
      padding: 0 12px;
      text-align: center;
    }
    h1 {
      margin: 0;
      color: #fff;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0;
    }
    p {
      max-width: 384px;
      margin: 8px auto 0;
      color: rgba(255, 255, 255, 0.60);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.55;
      text-align: center;
    }
    .request-id {
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.42);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11.5px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }
    .button-frame {
      position: relative;
      z-index: 4;
      display: block;
      width: fit-content;
      margin: 16px auto 0;
      padding-top: 2px;
      padding-right: 2px;
      border-top: 1px solid rgba(217, 217, 217, 0.80);
      border-right: 1px solid rgba(217, 217, 217, 0.45);
      cursor: pointer;
    }
    .visit-link {
      display: block;
      border: 0;
      border-radius: 0;
      background: #000;
      padding: 14.85px 22.8px;
      color: #fff;
      font: inherit;
      font-size: 14.5px;
      font-weight: 500;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .visit-link:hover { transform: scale(0.99); }
    .visit-link:active { transform: scale(1.1); }
    @media (min-width: 768px) {
      .large-layer { top: 20px; }
      .large-layer.shadow { top: -16px; }
      .medium-layers {
        margin-top: 100px;
        height: 210px;
      }
      .content { margin-top: 40px; }
      .button-frame { margin-top: 27px; }
    }
    @media (min-width: 1024px) {
      .large-404 { font-size: 547.559px; }
      .medium-404 { font-size: 200.477px; }
      .medium-404.front { top: 24px; }
      .medium-layers {
        margin-top: 100px;
        height: 260px;
      }
      .content { margin-top: 40px; }
    }
  </style>
</head>
<body>
  <section class="not-found">
    <a class="logo-link" href="https://pxxl.app" aria-label="Visit Pxxl">
      <img src="https://cdn.pxxl.app/core/website/assets/pxxllogo.png" alt="Pxxl">
    </a>
    <div class="large-layer" aria-hidden="true">
      <h2 class="large-404">404</h2>
    </div>
    <div class="large-layer shadow" aria-hidden="true">
      <h2 class="large-404">404</h2>
    </div>
    <div class="medium-layers" aria-hidden="true">
      <p class="medium-404">404</p>
      <p class="medium-404 front">404</p>
    </div>
    <div class="content">
      <h1>oooops! chief..&#128546;</h1>
      <p>{{message}}</p>
      <p class="request-id">Reason: {{reason_code}}<br>Request ID: {{request_id}}</p>
      <div class="button-frame">
        <a class="visit-link" href="https://pxxl.app">Visit Pxxl</a>
      </div>
    </div>
  </section>
</body>
</html>
