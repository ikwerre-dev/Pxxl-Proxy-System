<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{status_code}} {{status_text}} | Pxxl Proxy</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #101318;
      --panel: #171c24;
      --text: #f5f7fb;
      --muted: #a9b2c3;
      --accent: #66d9c7;
      --border: #2a3342;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(720px, 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      padding: 32px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
    }
    .code {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.05;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }
    dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 10px 16px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    dt { color: var(--text); font-weight: 700; }
    dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="code">Pxxl Proxy / {{status_code}}</div>
    <h1>{{status_text}}</h1>
    <p>{{message}}</p>
    <dl>
      <dt>Domain</dt>
      <dd>{{domain}}</dd>
      <dt>Path</dt>
      <dd>{{path}}</dd>
    </dl>
  </main>
</body>
</html>
