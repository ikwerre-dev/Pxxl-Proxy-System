<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{status_code}} {{status_text}}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020305;
      --panel: rgba(8, 12, 18, 0.78);
      --panel-strong: rgba(13, 19, 29, 0.92);
      --text: #f8fbff;
      --muted: #9aa7b8;
      --soft: #d8e0ea;
      --line: rgba(255,255,255,0.12);
      --cyan: #50f4d7;
      --blue: #73a7ff;
      --violet: #b28cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 18% 18%, rgba(80, 244, 215, 0.18), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(115, 167, 255, 0.20), transparent 25%),
        radial-gradient(circle at 60% 86%, rgba(178, 140, 255, 0.16), transparent 30%),
        #020305;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    body::before {
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.80) 0 1px, transparent 1.3px),
        radial-gradient(circle, rgba(255,255,255,0.36) 0 1px, transparent 1.4px);
      background-size: 110px 110px, 170px 170px;
      background-position: 10px 20px, 60px 80px;
      opacity: 0.34;
      mask-image: linear-gradient(to bottom, black 0%, black 72%, transparent 100%);
    }
    body::after {
      background: linear-gradient(180deg, transparent 0%, rgba(2,3,5,0.64) 78%, #020305 100%);
    }
    main {
      position: relative;
      z-index: 1;
      width: min(760px, 100%);
      padding: clamp(28px, 5vw, 52px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--panel), var(--panel-strong));
      box-shadow: 0 26px 90px rgba(0,0,0,0.54), inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
    }
    .orbit {
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(110deg, rgba(80,244,215,0.34), transparent 28%, rgba(115,167,255,0.24) 64%, transparent);
      opacity: 0.55;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      padding: 1px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 24px var(--cyan);
    }
    h1 {
      margin: 16px 0 12px;
      max-width: 12ch;
      font-size: clamp(42px, 9vw, 82px);
      line-height: 0.95;
      letter-spacing: 0;
    }
    .message {
      max-width: 62ch;
      margin: 0;
      color: var(--soft);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.65;
    }
    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 30px;
    }
    .detail {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.035);
    }
    .label {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .value {
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .request {
      grid-column: 1 / -1;
      border-color: rgba(80,244,215,0.30);
      background: linear-gradient(90deg, rgba(80,244,215,0.10), rgba(115,167,255,0.07));
    }
    @media (max-width: 640px) {
      body { padding: 16px; }
      .details { grid-template-columns: 1fr; }
      h1 { font-size: clamp(38px, 15vw, 62px); }
    }
  </style>
</head>
<body>
  <main>
    <div class="orbit" aria-hidden="true"></div>
    <div class="eyebrow"><span class="dot"></span>Pxxl Proxy / {{status_code}}</div>
    <h1>{{status_text}}</h1>
    <p class="message">{{message}}</p>
    <div class="details">
      <div class="detail request">
        <div class="label">Request ID</div>
        <div class="value">{{request_id}}</div>
      </div>
      <div class="detail">
        <div class="label">Domain</div>
        <div class="value">{{domain}}</div>
      </div>
      <div class="detail">
        <div class="label">Path</div>
        <div class="value">{{path}}</div>
      </div>
    </div>
  </main>
</body>
</html>
