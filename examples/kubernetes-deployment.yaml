apiVersion: apps/v1
kind: Deployment
metadata:
  name: pxxl-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pxxl-edge
  template:
    metadata:
      labels:
        app: pxxl-edge
    spec:
      containers:
        - name: edge
          image: pxxl/edge:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - containerPort: 80
            - containerPort: 443
          env:
            - name: PXXL_ADMIN_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pxxl-admin
                  key: bootstrap-token
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: pxxl-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pxxl-edge
spec:
  selector:
    app: pxxl-edge
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
